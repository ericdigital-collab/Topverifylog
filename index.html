<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Verify - SMS Verification & Wallet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto; }
        .logo { color: #38bdf8; font-size: 1.5rem; font-weight: bold; text-align: left; }
        .nav-btns { display: flex; gap: 10px; }
        .nav-btn { background: #334155; color: #fff; padding: 8px 15px; text-decoration: none; border-radius: 6px; font-size: 0.9rem; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
        .section-title { margin-top: 20px; margin-bottom: 10px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        .btn { display: block; width: 100%; background-color: #38bdf8; color: #0f172a; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; border: none; cursor: pointer; margin-top: 15px; }
        .btn:hover { background-color: #0ea5e9; }
        .switch-text { margin-top: 15px; font-size: 0.9rem; color: #94a3b8; text-align: center; }
        .switch-text a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Top Verify</div>
        <div class="nav-btns">
            <a href="#login" class="nav-btn">Login</a>
            <a href="#register" class="nav-btn" style="background: #38bdf8; color: #0f172a;">Register</a>
        </div>
    </header>

    <!-- REGISTRATION SECTION -->
    <div class="container" id="register">
        <h2 class="section-title">Create Account</h2>
        <form>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn">Register & Get Started</button>
        </form>
        <p class="switch-text">Already have an account? <a href="#login">Login here</a></p>
    </div>

    <!-- LOGIN SECTION -->
    <div class="container" id="login" style="margin-top: 30px;">
        <h2 class="section-title">Account Login</h2>
        <form>
            <div class="form-group">
                <label>Email or Username</label>
                <input type="text" placeholder="Enter your email or username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Log In to Dashboard</button>
        </form>
    </div>
</body>
</html>
